services:
  - type: web
    name: koora-arena
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: XTREAM_SERVER
        sync: false
      - key: XTREAM_USERNAME
        sync: false
      - key: XTREAM_PASSWORD
        sync: false
